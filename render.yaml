services:
  - type: web
    name: rastaa-cabs-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_API_URL
        value: https://rastaa-cabs-backend-node.onrender.com

  - type: web
    name: rastaa-cabs-backend-node
    env: node
    rootDir: backend-node
    buildCommand: npm install
    startCommand: node server.js
    preDeployCommand: npm run seed
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JAVA_FARE_SERVICE_URL
        value: https://rastaa-cabs-backend-java.onrender.com/api/fare/calculate
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_MAX_POOL_SIZE
        value: 20
      - key: ADMIN_USERS
        value: admin:admin123:admin
      - key: ADMIN_SESSION_SECRET
        generateValue: true

  - type: web
    name: rastaa-cabs-backend-java
    env: java
    rootDir: backend-java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/fare-engine-1.0.0.jar
    envVars:
      - key: PORT
        value: 10000
