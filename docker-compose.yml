version: "3.8"

# A single-node replica set — not for redundancy (it's one node), but so
# local dev behaves like production: replica-set read preferences work,
# and multi-document transactions are available if you need them later.
# In production this becomes a real 3+ node replica set (or a sharded
# cluster once a single shard can't keep up — see README).
services:
  mongo:
    image: mongo:7
    container_name: rastaa-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }"
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-express:
    image: mongo-express:1.0.2
    container_name: rastaa-mongo-express
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH: "false"

volumes:
  mongo-data:
